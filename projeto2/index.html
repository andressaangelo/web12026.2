<!DOCTYPE html>
<lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulario</title>
</head>
<body>
    <form>
    <h1>Formulário</h1>
    <fieldset>
        <legend><h2> Dados Pessoais:</h2></legend> 
        <label>Nome:</label>
       <input type="text" size="70"> <br><br>
       <label>Data de Nascimento:</label> 
       <input type="date"> <br><br>
       <label>Endereço:</label>
       <input type="text" size="70"> <br><br>
       <label>Cidade:</label>
       <input type="text" size="20"> 
       <label>Bairro:</label>
       <input type="text" size="20"> <br><br>
       <label>Estado:</label>
       <select> 
           <option>Ceará</option>
           <option>Minas Gerais</option>
           <option>Pará</option>
       </select> 
        <label>CEP:</label>
       <input type="text" size="15"><br><br>
       <label>Cor Favotita:</label>
       <input type="color"> <br><br>
       <label>Nível de Satisfação:</label>
       <input type="range" min="0" max="100" value="50"> <br><br>  
       <span>100</span>
     </fieldset>
          <br>
          <fieldset>
            <legend> <h2> Dados Profissionais:</h2></legend>
            <h3>Natureza do cargo:</h3> 
            <input type="radio" id="gerencia" name="natureza_cargo" value="Gerencia">
            <label for="gerencial"> Gerencial</label>
            <input type="radio" id="financeiro" name="natureza_cargo" value="Financeiro">
            <label for="financeiro"> Financeiro</label> 
            <input type="radio" id="recepcao" name="natureza_cargo" value="Recepção">  
            <label for="recepcao"> Recepção</label> 
            <input type="radio" id="administrativo" name="natureza_cargo" value="Administrativo">  
            <label for="recepcao"> Administrativo</label> 
            <input type="radio" id="juridico" name="natureza_cargo" value="Juridico">  
            <label for="Juridico"> Juridico</label> 
            
            <h3>Área de interesse:</h3>
            <input type="checkbox"> Computação 
            <input type="checkbox"> Química 
            <input type="checkbox"> Engenharia
            <input type="checkbox"> Meio Ambiente
            <input type="checkbox"> Matemática
        
            <h3>Mini Currículo:</h3>
            <textarea rows5="5" cols="60"></textarea>
            <br><br>
            <button type="submit">Enviar</button>
            <button type="reset">Limpar</button> 
        </fieldset>
    </form>
 </body>
</html>
